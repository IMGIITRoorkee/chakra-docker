# Media files
location /media {
    # Media files can be found in the media volume mounted at /media_files
    alias   /media_files;

    # Expire the cache of these files daily
    expires 1d;
    # Don't log access to these files because of the sheer volume of logs that would generate
    access_log off;
}

# Static files
location /static {
    # Static files can be found in the static volume mounted at /static_files
    alias   /static_files;

    # Expire the cache of these files daily
    expires 1d;
    # Don't log access to these files because of the sheer volume of logs that would generate
    access_log off;
}


# Backend static files
location /static_backend {
    # Static files can be found in the static volume mounted at /static_backend
    alias    /home/root1/chakra-docker/codebase/chakra-backend/static_backend;

    # Expire the cache of these files daily
    expires 1d;
    # Don't log access to these files because of the sheer volume of logs that would generate
    access_log off;
}
