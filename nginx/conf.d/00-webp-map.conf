# WebP content negotiation, part 1 of 2 (http context).
#
# Part 2 is the location block in conf.d/includes/compression.conf, which every
# generated subdomain server block already includes.
#
# This must live at http level because `map` is not valid inside `server`. The
# 00- prefix keeps it ahead of anything that might depend on $webp_suffix.
#
# Pair with generate_webp_sidecars in chakra-backend, which writes
# '<name>.png.webp' next to '<name>.png'. Requests keep their original URL, so
# no published HTML or XML has to change.

map $http_accept $webp_suffix {
    default     "";
    "~*webp"    ".webp";
}
