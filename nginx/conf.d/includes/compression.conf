# Compression using gzip
gzip            on;
gzip_vary       on;
gzip_proxied    any;
gzip_comp_level 6;
gzip_min_length 1024;
# Both JS spellings: nginx changed the default type for .js from
# application/javascript to text/javascript in 1.21.3, so listing only the old
# one silently stops compressing JS after an nginx upgrade.
gzip_types      text/plain text/css text/xml text/javascript
                application/json application/javascript
                application/xml+rss application/atom+xml
                application/manifest+json
                image/svg+xml;

# WebP content negotiation, part 2 of 2 (server context).
# Part 1 is the $webp_suffix map in conf.d/00-webp-map.conf.
#
# Serves '<name>.png.webp' to browsers that advertise WebP and falls back to the
# original otherwise, so the URL in the published HTML never changes. Vary tells
# shared caches and any future CDN that the response depends on Accept.
location ~* \.(png|jpe?g)$ {
    add_header Vary Accept;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri$webp_suffix $uri =404;
}
