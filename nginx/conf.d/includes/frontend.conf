location /_next/static {
    alias /home/ubuntu/chakra-docker/codebase/chakra-frontend/.next/static;
    add_header Cache-Control "public, max-age=3600, immutable";
}

# Next.js ships its own public/assets. ^~ outranks the WebP regex in
# compression.conf, which would otherwise serve these from the document root.
location ^~ /assets/ {
    proxy_pass http://next;
}

location / {
    # Throttling for web socket URLs
    limit_req zone=chakra_zone burst=24 nodelay;

    # Reverse proxy the request to the upstream Daphne server
    proxy_pass          http://next;

    # These headers upgrade HTTP to WS
    proxy_http_version  1.1;
    proxy_set_header    Upgrade         $http_upgrade;
    proxy_set_header    Connection      "Upgrade";
}
