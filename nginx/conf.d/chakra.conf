# Configuration file for the production server of Omniport

# Defines the upstream servers
include new_conf/includes/upstreams.conf;

# Configuration for rate limiting and throttling
# limit_req_zone $binary_remote_addr rate=16r/s;

# Whether to add the HTTP to HTTPS redirect server
# If no line is present below, that's on the build script
# include conf.d/includes/01-redirect.conf;

# Configuration of the HTTP server
server {
    # The port the site will be served on
    listen      443 ssl;
    listen      [::]:443 ssl;
    
    # The domain name it will serve for
    server_name .chakra.channeli.in;

    ssl on;
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256;
    ssl_prefer_server_ciphers on;

    ssl_certificate /certificates/cms.crt;
    ssl_certificate_key /certificates/cms.key;

    # Use the UTF-8 charset
    charset     utf-8;

    # Max upload size
    # Adjust to taste
    client_max_body_size    10G;

    # Include support for MIME types
    include         mime.types;
    default_type    application/octet-stream;

    # Whether to enable SSL configuration
    # If no line is present below, that's on the build script
    # include conf.d/includes/ssl.conf;

    # Compression
    # Uses GNU Gzip
    include new_conf/includes/compression.conf;

    # All the location blocks for assets
    # Consists of external/ static/ media/ personal/ and branding/
    include new_conf/includes/assets.conf;

    # Security
    # Adds security-minded headers to the response
    # include conf.d/includes/security.conf;

    # Logging
    # Logs both access and errors
    # include new_conf/includes/logging.conf;
    error_log /var/log/nginx/chakra-error.log warn;
    access_log /var/log/nginx/chakra-access.log;

    # Application
    # Forwards the request to Gunicorn or Daphne appropriately
    include new_conf/includes/backend.conf;

    # The location block for that serves the frontend on /
    include new_conf/includes/frontend.conf;
}
