services:
  database:
    image: chakra-postgres:latest

    restart: always
    healthcheck:
      test: ['CMD', 'checkhealth']
      retries: 4

      interval: 16m
      timeout: 16s
      start_period: 2m

    expose:
    - 5432

    user: postgres

    env_file:
    - postgres/database.env

    volumes:
    - type: volume
      source: database
      target: /var/lib/postgresql/data
      read_only: false

    network_mode: host

  chakra-backend: # Django = Gunicorn + Daphne
    # Use the Django image we made ourselves by running ./scripts/build/django.sh
    image: chakra-backend:latest

    # No matter what, if the container stops, start it again
    restart: always

    # Expose the ports 8000 and 8001 used by Gunicorn and Daphne to other containers
    expose:
    - "8000"
    - "8001"
    
    user: ${CURRENT_UID}

    command: bash -c "source chakra_backend/.env && supervisord -c /supervisord.conf"
    # Mount the volumes on the Django container
    volumes:
      # Mount the code
    - type: bind
      source: ./codebase/chakra-backend/
      target: /chakra-backend
      read_only: true

      # Mount 'static_files' as its namesake in the root of the container
    - type: bind
      source: ./codebase/chakra-backend/static_files
      target: /static_files
      read_only: false

      # Mount 'media_files' as its namesake in the root of the container
    - type: bind
      source: ./codebase/chakra-backend/media_files
      target: /media_files
      read_only: false

      # Mount 'static_backend' as its namesake in the root of the container
    - type: volume
      source: static_backend
      target: /static_backend
      read_only: false

      # Mount 'personal_files' as its namesake in the root of the container
    - type: bind
      source: ./codebase/chakra-backend/website
      target: /website
      read_only: false

      # Mount 'supervisor.d' as its namesake in the root of the container
    - type: bind
      source: ./codebase/chakra-backend/supervisor.d
      target: /supervisor.d
      read_only: false

      # Mount 'web_server_logs' as its namesake in the root of the container
    - type: bind
      source: ./codebase/chakra-backend/web_server_logs
      target: /web_server_logs
      read_only: false

      # Mount '.history' as its namesake in the root of the container
    - type: bind
      source: ./codebase/chakra-backend/history_dir
      target: /.history
      read_only: false

    # The services that need to be ready before this one
    depends_on:
    - database

    # Connect to the custom default network
    # networks:
    # - network
    network_mode: host

  chakra_frontend:
    # Use the Django image we made ourselves by running ./scripts/build/django.sh
    image: chakra-frontend:latest

    # No matter what, if the container stops, start it again
    restart: always

    # Expose the ports 8000 and 8001 used by Gunicorn and Daphne to other containers
    expose:
    - "3000"

    environment:
      - PROXY=chakra.channeli.in

    command: bash -c "yarn build && pm2 start yarn --name "nextjs" --interpreter bash -- start && pm2 monit"
    # Mount the volumes on the Django container
    volumes:
      # Mount the code
    - type: bind
      source: ./codebase/chakra-frontend/
      target: /chakra-frontend
      read_only: false

    depends_on:
      - chakra-backend

    network_mode: host

  cache: # Memcached
    # Use the Memcached image we made ourselves by running ./scripts/build/memcached.sh
    image: chakra-memcached:latest

    # Check the health of the container periodically
    healthcheck:
      test: ['CMD', 'netcat', '-z', '127.0.0.1', '11211']
      retries: 4

      interval: 16m
      timeout: 16s
      start_period: 2m

    # No matter what, if the container stops, start it again
    restart: always

    # Expose the port 5672 used by RabbitMQ to other containers
    expose:
    - "11211"

    # Run the container as the non-root user
    user: memcache

    # Connect to the custom default network
    network_mode: host

  message-broker: # RabbitMQ
    # Use the RabbitMQ image we made ourselves by running ./scripts/build/rabbitmq.sh
    image: chakra-rabbitmq:latest

    # Check the health of the container periodically
    healthcheck:
      test: ['CMD', 'checkhealth']
      retries: 4

      interval: 16m
      timeout: 16s
      start_period: 2m

    # No matter what, if the container stops, start it again
    restart: always

    # Expose the port 5672 used by RabbitMQ to other containers
    expose:
    - "5672"

    # Run the container as the non-root user
    user: rabbitmq

    # Set the environment variables
    env_file:
    - rabbitmq/message_broker.env

    # Mount the volumes on the message broker container
    volumes:
      # Mount 'rabbitmq-data' as the place where RabbitMQ stores its data
    - type: volume
      source: rabbitmq_data
      target: /var/lib/rabbitmq
      read_only: false

    # Connect to the custom default network
    network_mode: host


volumes:
  # This volume contains the database and PostgreSQL configuration files
  database:
  # This volume contains periodic dumps of the database for backup
  database_backup:

  # This volume contains web server logs
  web_server_logs:

  # This volume contains the static files
  static_files:

  # This volume is for static files of backend
  static_backend:

  # This volume contains the media files
  media_files:
  # This volume contains periodic dumps of the media files for backup
  media_files_backup:

  # This volume contains the personal media files
  website:

  # This volume contains the supervisor.d conf files
  supervisor.d:

  # This volume contains the history files
  .history:

  # RabbitMQ needs a volume at /var/lib/rabbitmq/
  rabbitmq_data:

# Networks specify how containers communicate with each other and the host
# networks:
#   # Create a network to override Docker's ambiguously named default
#   network:
