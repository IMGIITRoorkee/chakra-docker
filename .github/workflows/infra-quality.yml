name: Infra Quality Gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; exit 1; }
          done

      - name: Shellcheck
        # Only errors block. --severity=warning currently reports ~20 findings in
        # scripts predating this gate; tighten once those are cleared.
        run: shellcheck --severity=error --shell=bash $(git ls-files '*.sh')

  comments:
    name: comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comment style
        run: |
          git ls-files '*.sh' '*.py' '*.yml' '*.yaml' \
            | xargs python3 .github/scripts/comment_lint.py

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stub the gitignored env files
        run: |
          cp postgres/database_stencil.env postgres/database.env
          cp rabbitmq/message_broker_stencil.env rabbitmq/message_broker.env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Containers must not default to root
        # user: ${CURRENT_UID} with no default renders empty, which means root.
        run: |
          docker compose config \
            | python3 -c "import sys,yaml; s=yaml.safe_load(sys.stdin)['services']; \
                bad=[n for n,v in s.items() if v.get('user','') in ('', None)]; \
                sys.exit('services running as root: ' + ', '.join(bad)) if bad else print('all services pin a user')"

  nginx:
    name: nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble a harness around the tracked includes
        run: |
          mkdir -p harness/conf.d harness/www/assets harness/www/dept/assets \
                   harness/facultysite/assets harness/microsite/assets
          cp -r nginx/conf.d/includes harness/conf.d/
          cp nginx/conf.d/00-webp-map.conf harness/conf.d/
          # 8080 mirrors root1, where Next.js owns /assets. 8081 mirrors a root2
          # block, including the prefix alias routes a regex location would steal.
          cat > harness/nginx.conf <<'EOF'
          events {}
          http {
              # Defined in chakra_stencil.conf at http level; the includes reference it.
              limit_req_zone $binary_remote_addr zone=chakra_zone:16m rate=16r/s;
              include /etc/nginx/harness/conf.d/00-webp-map.conf;
              include /etc/nginx/harness/conf.d/includes/upstreams.conf;
              server {
                  listen 8080;
                  root /etc/nginx/harness/www;
                  include /etc/nginx/harness/conf.d/includes/compression.conf;
                  include /etc/nginx/harness/conf.d/includes/assets.conf;
                  include /etc/nginx/harness/conf.d/includes/backend.conf;
                  include /etc/nginx/harness/conf.d/includes/frontend.conf;
              }
              server {
                  listen 8081;
                  root /etc/nginx/harness/www;
                  include /etc/nginx/harness/conf.d/includes/compression.conf;
                  include /etc/nginx/harness/conf.d/includes/webp-assets.conf;
                  # faculty-website-route.conf
                  location /~fac {
                      alias /etc/nginx/harness/facultysite;
                  }
                  # a short-url / microsite route, e.g. location "/aarohi"
                  location /aarohi {
                      alias /etc/nginx/harness/microsite;
                  }
              }
          }
          EOF

      - name: Validate
        run: |
          docker run --rm -v "$PWD/harness:/etc/nginx/harness:ro" nginx:alpine \
            nginx -t -c /etc/nginx/harness/nginx.conf

      - name: Serve a request through the harness
        run: |
          printf 'root-png'       > harness/www/assets/top.png
          printf 'root-webp'      > harness/www/assets/top.png.webp
          printf 'png-only'       > harness/www/assets/lonely.png
          printf 'deep-png'       > harness/www/dept/assets/photo.png
          printf 'deep-webp'      > harness/www/dept/assets/photo.png.webp
          printf 'faculty-file'   > harness/facultysite/assets/photo.png
          printf 'microsite-file' > harness/microsite/assets/photo.png
          docker run -d --name webp-harness -p 8080:8080 -p 8081:8081 \
            -v "$PWD/harness:/etc/nginx/harness:ro" nginx:alpine \
            nginx -g 'daemon off;' -c /etc/nginx/harness/nginx.conf
          for _ in $(seq 20); do curl -sf -o /dev/null http://localhost:8081/assets/top.png && break; sleep 0.5; done

          get() { curl -sf ${2:+-H "Accept: $2"} "http://localhost:8081$1"; }
          check() { [ "$2" = "$3" ] || { echo "::error::$1: expected '$3', got '$2'"; docker logs webp-harness; exit 1; }; }

          check "webp client gets the sidecar" \
            "$(get /assets/top.png 'image/webp,*/*')" root-webp
          check "non-webp client gets the original" \
            "$(get /assets/top.png 'image/png')" root-png
          check "falls back when no sidecar exists" \
            "$(get /assets/lonely.png 'image/webp,*/*')" png-only
          check "Vary: Accept is advertised" \
            "$(curl -sI -H 'Accept: image/webp' http://localhost:8081/assets/top.png \
               | tr -d '\r' | grep -icx 'vary: accept')" 1

          # Longer prefixes must keep their alias. A regex location would steal these.
          check "faculty alias is not shadowed" \
            "$(get /~fac/assets/photo.png 'image/webp,*/*')" faculty-file
          check "short-url alias is not shadowed" \
            "$(get /aarohi/assets/photo.png 'image/webp,*/*')" microsite-file

          # Known limit of the prefix approach: only top-level /assets negotiates.
          check "nested page assets serve the original" \
            "$(get /dept/assets/photo.png 'image/webp,*/*')" deep-png

          # root1 does not include webp-assets.conf; Next.js keeps /assets.
          check "frontend keeps /assets on the Chakra server" \
            "$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: image/webp' http://localhost:8080/assets/top.png)" 502

          docker rm -f webp-harness
